<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrackDrive Lead Form — InfoWorx (check_fe_agents)</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #111827;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --accent: #22c55e;
            --danger: #ef4444;
            --border: #374151;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(160deg, #020617, #0f172a);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
        }

        h1 {
            margin-top: 0;
            font-size: 22px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 20px;
        }

        fieldset {
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 16px;
            padding: 14px;
        }

        legend {
            color: #d1d5db;
            font-size: 13px;
            padding: 0 6px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            color: #d1d5db;
        }

        label .req {
            color: var(--danger);
        }

        input,
        select,
        textarea,
        button {
            width: 100%;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0b1220;
            color: var(--text);
            padding: 10px;
            font-size: 14px;
        }

        select option {
            background: #0b1220;
        }

        button {
            cursor: pointer;
            background: var(--accent);
            color: #052e16;
            border: 0;
            font-weight: 700;
            margin-top: 8px;
            padding: 12px;
            font-size: 15px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .status {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            display: none;
            white-space: pre-wrap;
            line-height: 1.4;
            font-size: 13px;
        }

        .status.ok {
            display: block;
            background: #052e16;
            color: #bbf7d0;
            border: 1px solid #15803d;
        }

        .status.error {
            display: block;
            background: #450a0a;
            color: #fecaca;
            border: 1px solid #b91c1c;
        }

        .status.info {
            display: block;
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
        }

        .small {
            font-size: 12px;
            color: var(--muted);
        }

        @media (max-width: 760px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>TrackDrive Lead Form</h1>
        
        <form id="leadForm">
            <fieldset>
                <legend>Required Lead Details</legend>
                <div class="grid">

                    <div class="field">
                        <label for="first_name">First Name <span class="req">*</span></label>
                        <input id="first_name" name="first_name" placeholder="Jane" required />
                    </div>

                    <div class="field">
                        <label for="last_name">Last Name <span class="req">*</span></label>
                        <input id="last_name" name="last_name" placeholder="Doe" required />
                    </div>

                    <div class="field">
                        <label for="caller_id">Caller Phone Number <span class="req">*</span></label>
                        <input id="caller_id" name="caller_id" placeholder="7194451111" required />
                        <span class="small">10–11 digits. Lead's telephone number.</span>
                    </div>

                    <div class="field">
                        <label for="email">Email Address <span class="req">*</span></label>
                        <input id="email" name="email" type="email" placeholder="jane@example.com" required />
                    </div>

                    <div class="field full">
                        <label for="address">Address <span class="req">*</span></label>
                        <input id="address" name="address" placeholder="123 Fake Street" required />
                    </div>

                    <div class="field">
                        <label for="dob">Date of Birth <span class="req">*</span></label>
                        <input id="dob" name="dob" type="date" required />
                        <span class="small">Format YYYY-MM-DD.</span>
                    </div>

                    <div class="field full">
                        <label for="trusted_form_cert_url">Trusted Form Certificate URL <span class="req">*</span></label>
                        <input id="trusted_form_cert_url" name="trusted_form_cert_url" type="url"
                            placeholder="https://cert.trustedform.com/..." required />
                    </div>

                    <div class="field full">
                        <label for="source_url">Source URL <span class="req">*</span></label>
                        <input id="source_url" name="source_url" type="url"
                            placeholder="https://example.com/..." required />
                    </div>

                </div>
            </fieldset>

            <button id="submitBtn" type="submit">Submit Lead to TrackDrive</button>
            <div id="status" class="status" aria-live="polite"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById("leadForm");
        const statusEl = document.getElementById("status");
        const submitBtn = document.getElementById("submitBtn");

        function setStatus(message, type) {
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }

        function digitsOnly(value) {
            return (value || "").toString().replace(/\D/g, "");
        }

        function cleanPhone(phone) {
            let d = digitsOnly(phone);
            if (d.length === 11 && d.startsWith("0")) {
                d = d.substring(1);
            }
            return d;
        }

        function validPhone(phone) {
            const d = cleanPhone(phone);
            return d.length === 10 || (d.length === 11 && d.startsWith("1"));
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            statusEl.className = "status";

            const data = new FormData(form);
            const get = (name) => (data.get(name) || "").toString().trim();

            if (!validPhone(get("caller_id"))) {
                setStatus("Caller Phone Number must be a valid 10-digit US phone number (e.g. 7194451111).", "error");
                return;
            }

            // ── Split DOB ────────────────────────────────────────────────
            let dob_mm = "", dob_dd = "", dob_yyyy = "";
            const dobRaw = get("dob");
            if (dobRaw) {
                const [y, m, d] = dobRaw.split("-");
                dob_yyyy = y; dob_mm = m; dob_dd = d;
            }

            // ── Build payload with required fields ───────────────────────
            const payload = {
                first_name: get("first_name"),
                last_name: get("last_name"),
                caller_id: cleanPhone(get("caller_id")),
                email: get("email"),
                address: get("address"),
                dob: dobRaw,
                dob_mm, dob_dd, dob_yyyy,
                trusted_form_cert_url: get("trusted_form_cert_url"),
                source_url: get("source_url") || window.location.href,
            };

            submitBtn.disabled = true;
            submitBtn.textContent = "Pinging TrackDrive…";

            try {
                const res = await fetch("/api/send-email", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });

                const body = await res.json().catch(() => ({}));

                if (!res.ok) {
                    throw new Error(body.error || `Request failed (HTTP ${res.status})`);
                }

                setStatus(
                    `Lead submitted successfully!\nA notification email with the full submission log has been sent to your inbox.`,
                    "ok"
                );
                form.reset();
            } catch (error) {
                setStatus(`Submission failed: ${error.message}`, "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Submit Lead to TrackDrive";
            }
        });
    </script>

</body>

</html>
